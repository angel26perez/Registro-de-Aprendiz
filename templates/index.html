<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Aprendices</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }
        .contenedor {
            background: white;
            padding: 25px;
            width: 600px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
        input {
            padding: 10px;
            margin: 5px 0;
            width: 90%;
        }
        button {
            padding: 10px 20px;
            background: #198754;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }
        button.btn-eliminar {
            background: #dc3545;
            padding: 5px 10px;
        }
        table {
            width: 100%;
            margin-top: 25px;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }
        th {
            background: #198754;
            color: white;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <h2>Registro de Aprendices</h2>
        <form action="/registrar" method="POST">
            <input type="text" name="nombre" placeholder="Nombre del aprendiz" required><br>
            <input type="email" name="correo" placeholder="Correo electrónico" required><br>
            <button type="submit">Registrar</button>
        </form>

        <h3>Aprendices registrados</h3>
        <table>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Correo</th>
                <th>Acción</th>
            </tr>
            {% for aprendiz in aprendices %}
            <tr>
                <td>{{ aprendiz.id }}</td>
                <td>{{ aprendiz.nombre }}</td>
                <td>{{ aprendiz.correo }}</td>
                <td>
                    <!-- Formulario POST exigido en la guía de despliegue para eliminar -->
                    <form action="/eliminar/{{ aprendiz.id }}" method="POST" style="display:inline;">
                        <button type="submit" class="btn-eliminar">Eliminar</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
